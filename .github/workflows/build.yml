name: Build Day Wheel Quest Markers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'DayWheelQuestMarkers.csproj'
      - 'nuget.config'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: day-wheel-quest-markers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify source identity
        shell: pwsh
        run: |
          $expected = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Expected source SHA: $expected"
          Write-Host "Checked out source SHA: $actual"
          if ($actual -ne $expected) { throw "Source identity mismatch: expected $expected, got $actual" }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DayWheelQuestMarkers.csproj --configfile nuget.config

      - name: Build Release DLL
        run: dotnet build DayWheelQuestMarkers.csproj -c Release --no-restore

      - name: Verify reminder policy and scene readiness
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /out:bin\Release\ReminderPolicyTests.exe tests\ReminderPolicyTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Policy test compilation failed' }
          & $compiler /nologo /out:bin\Release\SceneReadinessTests.exe tests\SceneReadinessTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Scene readiness test compilation failed' }
          # Host references are compile-only packages and are not copied beside the plugin.
          $packageRoot = Join-Path $env:USERPROFILE '.nuget/packages'
          $dependencyDirectories = @('bepinex.core/5.4.21', 'bepinex.baselib/5.4.21', 'unity3d.sdk/2020.3.13.1') |
            ForEach-Object { Get-ChildItem (Join-Path $packageRoot $_) -Recurse -Filter '*.dll' } |
            Select-Object -ExpandProperty DirectoryName -Unique
          $testArguments = @('bin/Release/DayWheelQuestMarkers.dll', 'validator/fixtures/lifecycle-paths-1.1.6.tsv') + @($dependencyDirectories)
          & bin/Release/ReminderPolicyTests.exe @testArguments
          if ($LASTEXITCODE -ne 0) { throw 'Dialogue reminder policy regression' }
          & bin/Release/SceneReadinessTests.exe @testArguments
          if ($LASTEXITCODE -ne 0) { throw 'Scene readiness regression' }

      - name: Read version and stage artifact
        id: artifact
        shell: pwsh
        run: |
          $source = Get-Content 'src/CalendarQuestsPinsPlugin.cs' -Raw
          if ($source -notmatch 'PluginVersion\s*=\s*"([^"]+)"') {
            throw 'Could not read PluginVersion from src/CalendarQuestsPinsPlugin.cs'
          }
          $version = $Matches[1]
          [xml]$project = Get-Content 'DayWheelQuestMarkers.csproj' -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path 'bin/Release/DayWheelQuestMarkers.dll')).Version.ToString()
          if ($projectVersion -ne $version -or $assemblyVersion -ne "$version.0") {
            throw "Version identity mismatch: plugin=$version project=$projectVersion assembly=$assemblyVersion"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "DayWheelQuestMarkers-$version.dll"
          Copy-Item 'bin/Release/DayWheelQuestMarkers.dll' "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Day Wheel Quest Markers $version SHA-256: $hash"

      - name: Upload versioned DLL
        uses: actions/upload-artifact@v4
        with:
          name: DayWheelQuestMarkers-${{ steps.artifact.outputs.version }}
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

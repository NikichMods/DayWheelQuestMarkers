name: Compile dev candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'DayWheelQuestMarkers.csproj'
      - 'nuget.config'
      - 'src/**'
      - '.github/workflows/compile-dev-candidate.yml'

permissions:
  contents: read

concurrency:
  group: compile-dev-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.head_ref == 'dev/1.1.8'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DayWheelQuestMarkers.csproj --configfile nuget.config
      - name: Compile Release
        run: dotnet build DayWheelQuestMarkers.csproj -c Release --no-restore --nologo

name: Build MultipleAnswer gate probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/multiple-answer-gate-probe
    paths:
      - 'MultipleAnswerGateProbe.csproj'
      - 'src/MultipleAnswerGateProbe.cs'
      - 'src/ReflectionUtil.cs'
      - '.github/workflows/multiple-answer-gate-probe.yml'
      - 'nuget.config'

permissions:
  contents: read

concurrency:
  group: multiple-answer-gate-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MultipleAnswerGateProbe.csproj --configfile nuget.config

      - name: Build read-only probe
        run: dotnet build MultipleAnswerGateProbe.csproj -c Release --no-restore

      - name: Stage artifact
        id: artifact
        shell: pwsh
        run: |
          $source = Get-Content 'src/MultipleAnswerGateProbe.cs' -Raw
          if ($source -notmatch 'PluginVersion\s*=\s*"([^"]+)"') {
            throw 'Could not read PluginVersion'
          }
          $version = $Matches[1]
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "DayWheelQuestMarkers-multiple-answer-gate-probe-$version.dll"
          Copy-Item 'bin/MultipleAnswerGateProbe/DayWheelQuestMarkers.MultipleAnswerGateProbe.dll' "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item "dist/$asset").Length
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Probe $version SHA-256: $hash"
          Write-Host "Probe $version bytes: $size"

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: MultipleAnswerGateProbe-${{ steps.artifact.outputs.version }}
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

name: Publish accepted Day Wheel Quest Markers 1.1.9

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'DayWheelQuestMarkers.csproj'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable metadata
        uses: actions/checkout@v4

      - name: Download exact accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p accepted
          gh run download 35894899505 \
            --repo "${GITHUB_REPOSITORY}" \
            --name DayWheelQuestMarkers-1.1.9 \
            --dir accepted

      - name: Verify exact accepted DLL
        id: accepted
        run: |
          set -euo pipefail
          dll="$(find accepted -type f -name '*.dll' -print -quit)"
          test -n "$dll"
          actual="$(sha256sum "$dll" | awk '{print $1}')"
          expected="069f9e1533f42fb4c4673effb5069de4354d72aeeb32e48818b14a752cb6359e"
          echo "Accepted DLL: $dll"
          echo "SHA-256: $actual"
          test "$actual" = "$expected"
          cp "$dll" DayWheelQuestMarkers.dll
          test "$(stat -c '%s' DayWheelQuestMarkers.dll)" = "101376"

      - name: Publish exact accepted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.9 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v1.1.9 already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v1.1.9 DayWheelQuestMarkers.dll \
            --repo "${GITHUB_REPOSITORY}" \
            --target 73b35a3bffcb440bf644dd03532fbf2cf6ce4b11 \
            --title "Day Wheel Quest Markers 1.1.9" \
            --notes-file release/1.1.9.md

      - name: Verify published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download v1.1.9 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern DayWheelQuestMarkers.dll \
            --dir verify
          actual="$(sha256sum verify/DayWheelQuestMarkers.dll | awk '{print $1}')"
          expected="069f9e1533f42fb4c4673effb5069de4354d72aeeb32e48818b14a752cb6359e"
          echo "Published SHA-256: $actual"
          test "$actual" = "$expected"
          test "$(stat -c '%s' verify/DayWheelQuestMarkers.dll)" = "101376"
